name: Build Ushirika Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "CUK-logo.png"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare optional Play upload key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ushirika-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ushirika-upload.jks" >> "$GITHUB_ENV"
      - name: Use the repository's CUK logo as the app icon
        run: |
          mkdir -p app/src/main/res/drawable
          test -s ../CUK-logo.png
          cp ../CUK-logo.png app/src/main/res/drawable/cuk_logo.png
          file app/src/main/res/drawable/cuk_logo.png
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release Android App Bundle
        run: gradle bundleRelease
      - name: Publish APK at a stable download URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_PATH#ushirika-club.apk" --clobber
          else
            gh release create android-latest "$APK_PATH#ushirika-club.apk" --title "Ushirika Android app - latest build" --notes "Latest installable Android APK for the Ushirika Journalism Club portal. This app requires an internet connection to access the website. Android may ask you to approve installing apps downloaded from your browser." --prerelease
          fi
      - name: Upload APK and AAB build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ushirika-android-builds
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
