name: Build Ushirika Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release Android App Bundle
        run: gradle bundleRelease
      - name: Upload APK and AAB build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ushirika-android-builds
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
