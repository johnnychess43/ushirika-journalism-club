name: Flask application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: sqlite:////tmp/ushirika-ci.db
      INSTANCE_DIR: /tmp/ushirika-ci-instance
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
