plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ushirika.journalismclub'
    compileSdk 35

    defaultConfig {
        applicationId 'org.ushirika.journalismclub'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            // Configure an upload-key signing config before publishing to Google Play.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
