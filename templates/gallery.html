{% extends "base.html" %}{% block title %}Gallery | Ushirika{% endblock %}{% block content %}<section class="section"><div class="eyebrow">Photojournalism</div><h1 class="section-title">Club gallery</h1><div class="grid">{% for photo in photos %}<article class="card"><img src="{{ url_for('gallery_image',photo_id=photo.id) }}" alt="{{ photo.caption }}" style="width:100%;height:240px;object-fit:cover;border-radius:4px"><h3>{{ photo.caption }}</h3><p class="meta">Uploaded by {{ photo.uploader.full_name }}</p></article>{% else %}<div class="empty">No gallery photos yet.</div>{% endfor %}</div></section>{% endblock %}
