services:
  - type: web
    name: ushirika-journalism-club
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    disk:
      name: ushirika-upload-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INSTANCE_DIR
        value: /var/data/instance
      - key: DATABASE_URL
        fromDatabase:
          name: ushirika-club-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_NAME
        value: John Chesiro Cheptai
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MPESA_RECIPIENT_NUMBER
        value: "0140415653"
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: ushirika-club-db
    plan: starter
    databaseName: ushirika
    user: ushirika_admin
